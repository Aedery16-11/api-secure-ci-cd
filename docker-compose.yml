version: "3.8"

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://tickets:password123@db:5432/tickets
    depends_on:
      - db

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tickets
